name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # pull request to main -> run tests
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr.yml

  # merged into main -> build images, e2e, push to staging branch
  main:
    if: github.event_name == 'push'
    uses: ./.github/workflows/main-to-staging.yml
    permissions:
      contents: write
      packages: write 

  # after main passed -> staging checks
  staging:
    needs: main
    uses: ./.github/workflows/staging.yml
