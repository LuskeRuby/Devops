name: Kids Planner CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Build & Test Backend
        run: chmod +x mvnw && ./mvnw verify
        working-directory: ./backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Lint Frontend
        run: npx ng lint
        working-directory: ./frontend
      - name: Check Formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"
        working-directory: ./frontend
      - name: Test Frontend
        run: npx ng test --no-watch
        working-directory: ./frontend
      - name: Build Angular App
        run: npm run build --configuration=production
        working-directory: ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Declare the secrets as environment variables for the action
        env:
          SSL_CERTIFICATE: ${{ secrets.SSL_CERTIFICATE }}
          SSL_PRIVATE_KEY: ${{ secrets.SSL_PRIVATE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SSL_CERTIFICATE,SSL_PRIVATE_KEY
          script: |
            cd ~/full-stack-app
            git fetch origin
            git reset --hard origin/main
            
            # --- SSL Setup ---
            mkdir -p certs
            echo "$SSL_CERTIFICATE" > certs/cert.pem
            echo "$SSL_PRIVATE_KEY" > certs/key.pem
            chmod 600 certs/key.pem # Secure the private key
            # -----------------
            
            docker compose down
            docker compose up -d --build