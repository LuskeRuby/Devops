name: PR tests

on: workflow_call

jobs:
  # Renders every compose file combination with dummy values. A typo, a missing variable or a broken
  # include fails here, not in the middle of a release (the production files are otherwise only
  # evaluated on the servers).
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dev (base + override)
        run: docker compose config -q
      - name: CI (base + ci)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
        env:
          IMAGE_TAG: dummy
      - name: Server B (prod-frontend)
        run: docker compose -f docker-compose.prod-frontend.yml config -q
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          BACKEND_SERVERS: "server 10.8.0.2:8080;"
          POSTGRES_BIND: 10.8.0.1
          PG_HBA_FILE: pg_hba.prod.conf
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          RABBITMQ_BIND: 10.8.0.1
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password
      - name: Server B refuses to render without the broker login
        run: |
          if docker compose -f docker-compose.prod-frontend.yml config -q 2>/dev/null; then
            echo "::error::prod-frontend rendered without RABBITMQ_USER/RABBITMQ_PASSWORD"
            exit 1
          fi
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          BACKEND_SERVERS: "server 10.8.0.2:8080;"
          POSTGRES_BIND: 10.8.0.1
          PG_HBA_FILE: pg_hba.prod.conf
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          RABBITMQ_BIND: 10.8.0.1
      - name: Server A (prod-backend)
        run: docker compose -f docker-compose.prod-backend.yml config -q
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          IP_FRONTEND_WG: 10.8.0.1
          IP_BACKEND_WG: 10.8.0.2
          PROD_DB_USER: user
          PROD_DB_PASSWORD: password
          APP_JWT_SECRET: 0123456789abcdef0123456789abcdef
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password
      - name: Server A instances (profile scale)
        run: |
          # release.yml, nginx and the check script assume instance N is backend-N on port 8079+N
          max=$(sed -n 's/^ *MAX_BACKENDS: *\([0-9]*\).*/\1/p' .github/workflows/release.yml)
          expected=$(seq -f 'backend-%g' 1 "$max" | tr '\n' ' ')
          services=$(docker compose --profile scale -f docker-compose.prod-backend.yml config --services | sort | tr '\n' ' ')
          [ "$services" = "$expected" ] || { echo "::error::MAX_BACKENDS is $max but compose has: $services"; exit 1; }
          ports=$(docker compose --profile scale -f docker-compose.prod-backend.yml config | sed -n 's/.*published: "\([0-9]*\)".*/\1/p' | sort | tr '\n' ' ')
          expected_ports=$(seq 8080 $((8079 + max)) | tr '\n' ' ')
          [ "$ports" = "$expected_ports" ] || { echo "::error::ports must be $expected_ports, got: $ports"; exit 1; }
          # without the profile only backend-1 may start
          services=$(docker compose -f docker-compose.prod-backend.yml config --services | tr '\n' ' ')
          [ "$services" = "backend-1 " ] || { echo "::error::only backend-1 may start without the scale profile, got: $services"; exit 1; }
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          IP_FRONTEND_WG: 10.8.0.1
          IP_BACKEND_WG: 10.8.0.2
          PROD_DB_USER: user
          PROD_DB_PASSWORD: password
          APP_JWT_SECRET: 0123456789abcdef0123456789abcdef
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password
      - name: Server A refuses to render without the broker login
        run: |
          if docker compose -f docker-compose.prod-backend.yml config -q 2>/dev/null; then
            echo "::error::prod-backend rendered without RABBITMQ_USER/RABBITMQ_PASSWORD"
            exit 1
          fi
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          IP_FRONTEND_WG: 10.8.0.1
          IP_BACKEND_WG: 10.8.0.2
          PROD_DB_USER: user
          PROD_DB_PASSWORD: password
          APP_JWT_SECRET: 0123456789abcdef0123456789abcdef
      - name: Dev with monitoring (base + override + monitoring)
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.monitoring.yml config -q
        env:
          GRAFANA_ADMIN_PASSWORD: password
      - name: Server B with monitoring
        run: docker compose -f docker-compose.prod-frontend.yml -f docker-compose.prod-frontend-monitoring.yml config -q
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          BACKEND_SERVERS: "server 10.8.0.2:8080;"
          POSTGRES_BIND: 10.8.0.1
          PG_HBA_FILE: pg_hba.prod.conf
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          RABBITMQ_BIND: 10.8.0.1
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password
          IP_FRONTEND_WG: 10.8.0.1
          GRAFANA_ADMIN_PASSWORD: password
      - name: Server B refuses to render without the Grafana password
        run: |
          if docker compose -f docker-compose.prod-frontend.yml -f docker-compose.prod-frontend-monitoring.yml config -q 2>/dev/null; then
            echo "::error::the monitoring on Server B rendered without GRAFANA_ADMIN_PASSWORD"
            exit 1
          fi
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          BACKEND_SERVERS: "server 10.8.0.2:8080;"
          POSTGRES_BIND: 10.8.0.1
          PG_HBA_FILE: pg_hba.prod.conf
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          RABBITMQ_BIND: 10.8.0.1
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password
          IP_FRONTEND_WG: 10.8.0.1
      - name: Server A with monitoring
        run: docker compose --profile scale -f docker-compose.prod-backend.yml -f docker-compose.prod-backend-monitoring.yml config -q
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          IP_FRONTEND_WG: 10.8.0.1
          IP_BACKEND_WG: 10.8.0.2
          PROD_DB_USER: user
          PROD_DB_PASSWORD: password
          APP_JWT_SECRET: 0123456789abcdef0123456789abcdef
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password

      - name: Every production service caps its logs
        run: |
          # A service without log limits can fill the disk (it did once). This lists the ones without.
          check='
          import json, sys
          services = json.load(sys.stdin)["services"]
          bad = [n for n, s in services.items() if not (s.get("logging") or {}).get("options", {}).get("max-size")]
          if bad:
              print("::error::no log limit (max-size) on: " + ", ".join(sorted(bad))); sys.exit(1)
          print("log limits set on", len(services), "services")
          '
          docker compose -f docker-compose.prod-frontend.yml -f docker-compose.prod-frontend-monitoring.yml config --format json | python3 -c "$check"
          docker compose --profile scale -f docker-compose.prod-backend.yml -f docker-compose.prod-backend-monitoring.yml config --format json | python3 -c "$check"
        env:
          TAG: v0.0.0
          IP_FRONTEND_PUBLIC: 203.0.113.10
          BACKEND_SERVERS: "server 10.8.0.2:8080;"
          POSTGRES_BIND: 10.8.0.1
          PG_HBA_FILE: pg_hba.prod.conf
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          RABBITMQ_BIND: 10.8.0.1
          RABBITMQ_USER: user
          RABBITMQ_PASSWORD: password
          IP_FRONTEND_WG: 10.8.0.1
          IP_BACKEND_WG: 10.8.0.2
          GRAFANA_ADMIN_PASSWORD: password
          PROD_DB_USER: user
          PROD_DB_PASSWORD: password
          APP_JWT_SECRET: 0123456789abcdef0123456789abcdef

  # Lets Prometheus, Alloy and Loki check their own config files, so a typo fails here and not on the servers.
  # alloy fmt only checks the syntax; a misspelled setting is first found when Alloy starts.
  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus
        run: |
          for f in prometheus.yml prometheus.prod.yml; do
            docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config "/m/$f"
          done
      - name: Alloy
        run: |
          for f in config.alloy config.prod-backend.alloy; do
            docker run --rm -v "$PWD/monitoring:/m:ro" grafana/alloy:v1.21.3 fmt "/m/$f" > /dev/null
          done
      - name: Loki
        run: docker run --rm -v "$PWD/monitoring:/m:ro" grafana/loki:3.7.9 -config.file=/m/loki.yml -verify-config

  # Renders the nginx template the way the container does (envsubst with the production filter) and lets
  # nginx check the result, for different numbers of backend instances.
  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-signed certificate (only so that nginx -t can load one)
        run: |
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -keyout certs/key.pem -out certs/cert.pem
      - name: One backend
        run: bash .github/scripts/check-nginx.sh 1
      - name: Two backends
        run: bash .github/scripts/check-nginx.sh 2
      - name: Four backends
        run: bash .github/scripts/check-nginx.sh 4

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - run: | 
          chmod +x mvnw
          ./mvnw verify
        working-directory: ./backend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npx ng lint
        working-directory: ./frontend
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
        working-directory: ./frontend
      - run: npx ng test --no-watch
        working-directory: ./frontend
      - run: npm run build --configuration=production
        working-directory: ./frontend
