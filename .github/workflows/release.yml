name: Release

# A release is a tag vX.Y.Z pushed by a person (the tag ruleset blocks everything else).
# The images were already built and tested for the commit on main, so nothing is rebuilt here:
# the existing :<sha> images get the version as an extra tag, then that version is deployed.
on:
  push:
    tags: ["v*.*.*"]

env:
  IMAGE: ghcr.io/luskeruby/devops   # ghcr needs lowercase
  VERSION: ${{ github.ref_name }}

permissions:
  contents: read

# Never run two releases at the same time, and never cancel one that is half deployed.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tagged commit must have passed main -> staging
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all branches and history, to check against origin/staging
      - name: Check the tag name
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like v1.2.3"
            exit 1
          fi
      - name: Check the tagged commit is on staging
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/staging; then
            echo "::error::$GITHUB_SHA is not on staging. Only commits that passed e2e on main can be released."
            exit 1
          fi

  # Add the version tag to the images that already exist for this commit (no rebuild)
  retag:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the sha images with the version
        run: |
          for app in backend frontend; do
            docker buildx imagetools create -t "$IMAGE-$app:$VERSION" "$IMAGE-$app:$GITHUB_SHA"
          done

  deploy:
    needs: retag
    runs-on: ubuntu-latest
    environment: production   # holds the secrets below and can require an approval
    permissions:
      contents: read
      packages: read          # the server pulls the images with this token
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      IP_BACKEND_PUBLIC: ${{ vars.IP_BACKEND_PUBLIC }}
      IP_FRONTEND_PUBLIC: ${{ vars.IP_FRONTEND_PUBLIC }}
      DIR: family-planner                   # folder on the server, relative to the SSH user's home
      IP_BACKEND_WG: ${{ vars.IP_BACKEND_WG }}
      IP_FRONTEND_WG: ${{ vars.IP_FRONTEND_WG }}
    steps:
      - uses: actions/checkout@v7


      # Sanity check on the env values
      - name: Check the production variables are set
        run: |
          for v in SSH_USER IP_BACKEND_PUBLIC IP_FRONTEND_PUBLIC IP_BACKEND_WG IP_FRONTEND_WG; do
            [ -n "${!v}" ] || { echo "::error::$v is empty. Check the 'production' environment settings."; exit 1; }
          done

      # pg_hba.prod.conf cannot read variables, so check that it allows the backend's tunnel address.
      # This runs before any server is touched.
      - name: Check pg_hba.prod.conf allows the backend
        run: |
          addr="${IP_BACKEND_WG//./\\.}"
          grep -Eq "^host[[:space:]]+all[[:space:]]+all[[:space:]]+${addr}/32[[:space:]]+scram-sha-256" infra/postgres/pg_hba.prod.conf \
            || { echo "::error::infra/postgres/pg_hba.prod.conf must allow $IP_BACKEND_WG/32 (the IP_BACKEND_WG variable). Edit the file or the variable."; exit 1; }

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$IP_BACKEND_PUBLIC" "$IP_FRONTEND_PUBLIC" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config


      # Database first (Server B): the backend needs it, and on the very first deploy it does not exist yet.
      - name: Deploy DB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSL_CERTIFICATE: ${{ secrets.SSL_CERTIFICATE }}
          SSL_PRIVATE_KEY: ${{ secrets.SSL_PRIVATE_KEY }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          REMOTE="$SSH_USER@$IP_FRONTEND_PUBLIC"
          COMPOSE="docker compose -f docker-compose.prod-frontend.yml --env-file .env"

          ssh "$REMOTE" "mkdir -p ~/$DIR/certs ~/$DIR/infra"
          scp docker-compose.prod-frontend.yml "$REMOTE:$DIR/"
          scp -r infra/postgres "$REMOTE:$DIR/infra/"
          printf '%s\n' "$SSL_CERTIFICATE" | ssh "$REMOTE" "cat > ~/$DIR/certs/cert.pem"
          printf '%s\n' "$SSL_PRIVATE_KEY" | ssh "$REMOTE" "umask 077; cat > ~/$DIR/certs/key.pem"
          {
            echo "TAG=$VERSION"
            echo "IP_FRONTEND_PUBLIC=$IP_FRONTEND_PUBLIC"
            echo "IP_BACKEND_WG=$IP_BACKEND_WG"
            echo "POSTGRES_BIND=$IP_FRONTEND_WG"
            echo "PG_HBA_FILE=pg_hba.prod.conf"
            echo "POSTGRES_USER='$PROD_DB_USER'"
            echo "POSTGRES_PASSWORD='$PROD_DB_PASSWORD'"
          } | ssh "$REMOTE" "umask 077; cat > ~/$DIR/.env"

          printf '%s' "$GITHUB_TOKEN" | ssh "$REMOTE" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # --wait stops the release here, before the backend is touched, if Postgres is not healthy.
          ssh "$REMOTE" "cd ~/$DIR && $COMPOSE pull && $COMPOSE up -d --wait --wait-timeout 120 postgres"   # pulls the frontend image too
          ssh "$REMOTE" "docker logout ghcr.io"


      # Backend before frontend (Server A)
      - name: Deploy backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: |
          REMOTE="$SSH_USER@$IP_BACKEND_PUBLIC"
          COMPOSE="docker compose -f docker-compose.prod-backend.yml --env-file .env"

          ssh "$REMOTE" "mkdir -p ~/$DIR"
          scp docker-compose.prod-backend.yml "$REMOTE:$DIR/"
          {
            echo "TAG=$VERSION"
            echo "IP_FRONTEND_PUBLIC=$IP_FRONTEND_PUBLIC"
            echo "IP_BACKEND_WG=$IP_BACKEND_WG"
            echo "IP_FRONTEND_WG=$IP_FRONTEND_WG"
            echo "PROD_DB_USER='$PROD_DB_USER'"
            echo "PROD_DB_PASSWORD='$PROD_DB_PASSWORD'"
            echo "APP_JWT_SECRET='$APP_JWT_SECRET'"
          } | ssh "$REMOTE" "umask 077; cat > ~/$DIR/.env"

          printf '%s' "$GITHUB_TOKEN" | ssh "$REMOTE" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$REMOTE" "cd ~/$DIR && $COMPOSE pull && $COMPOSE up -d --remove-orphans && $COMPOSE ps"
          ssh "$REMOTE" "docker logout ghcr.io"


      # Check that the backend answers
      # Stop here if the backend is down, before the frontend is touched.
      - name: Backend test
        run: |
          ssh "$SSH_USER@$IP_BACKEND_PUBLIC" "IP_BACKEND_WG=$IP_BACKEND_WG bash -s" <<'EOF'
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "http://$IP_BACKEND_WG:8080/api/families/login")
            case "$code" in 4*) echo "backend answers ($code)"; exit 0 ;; esac
            echo "backend not ready yet (HTTP $code)"; sleep 3
          done
          echo "::error::backend did not answer after the deploy"
          cd ~/family-planner && docker compose -f docker-compose.prod-backend.yml --env-file .env logs --tail 40 backend-1
          exit 1
          EOF

      # Frontend (Server B)
      # The image was already pulled together with the DB
      - name: Deploy frontend
        run: |
          REMOTE="$SSH_USER@$IP_FRONTEND_PUBLIC"
          COMPOSE="docker compose -f docker-compose.prod-frontend.yml --env-file .env"
          ssh "$REMOTE" "cd ~/$DIR && $COMPOSE up -d --remove-orphans && $COMPOSE ps"


      # Test endpoints (nginx on B -> backend on A)
      - name: Front + Backend test
        run: |
          ssh "$SSH_USER@$IP_FRONTEND_PUBLIC" "curl -fsk -o /dev/null --retry 10 --retry-delay 3 --retry-connrefused https://localhost/"
          ssh "$SSH_USER@$IP_FRONTEND_PUBLIC" bash -s <<'EOF'
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://localhost/api/families/login)
            case "$code" in 4*) echo "backend answers through nginx ($code)"; exit 0 ;; esac
            echo "not ready yet (HTTP $code)"; sleep 3
          done
          echo "::error::nginx cannot reach the backend (check WireGuard and IP_BACKEND_WG)"
          exit 1
          EOF