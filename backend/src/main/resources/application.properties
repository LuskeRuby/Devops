spring.application.name=backend
server.forward-headers-strategy=framework

# Datasource
spring.datasource.url=jdbc:postgresql://postgres:5432/familyapp
spring.datasource.username=admin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA: Flyway owns the schema (db/migration); Hibernate only validates it against the entities
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Chat message broker. simple = Spring's in-memory broker (one backend instance; dev, CI, tests).
# relay = RabbitMQ over STOMP, needed for more than one backend instance.
app.broker.mode=${APP_BROKER_MODE:simple}
app.broker.relay.host=${APP_BROKER_RELAY_HOST:}
app.broker.relay.port=${APP_BROKER_RELAY_PORT:61613}
app.broker.relay.login=${APP_BROKER_RELAY_LOGIN:}
app.broker.relay.passcode=${APP_BROKER_RELAY_PASSCODE:}

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration=60000
app.jwt.refresh-token-cookie.secure=${APP_JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
app.jwt.refresh-token-cookie.same-site=${APP_JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
app.jwt.refresh-token-cookie.max-age-seconds=${APP_JWT_REFRESH_TOKEN_COOKIE_MAX_AGE_SECONDS:86400}