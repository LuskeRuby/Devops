name: family-planner-backend

# x-* makes to so docker doesn't run it.
# This makes it reusable for later
x-backend: &backend
  image: ghcr.io/luskeruby/devops-backend:${TAG:?set TAG to the release version}
  restart: always
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://${IP_FRONTEND_WG:?set IP_FRONTEND_WG}:5432/familyapp
    SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER:?set PROD_DB_USER}
    SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD}
    APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET (at least 32 characters)}
    APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://${IP_FRONTEND_PUBLIC:?set IP_FRONTEND_PUBLIC}}
    # Chat messages go through RabbitMQ on Server B (STOMP relay), so every backend instance shares one
    # broker. Putting APP_BROKER_MODE=simple in this server's .env falls back to the in-memory broker,
    # which is only correct while a single backend runs.
    APP_BROKER_MODE: ${APP_BROKER_MODE:-relay}
    APP_BROKER_RELAY_HOST: ${IP_FRONTEND_WG:?set IP_FRONTEND_WG}
    APP_BROKER_RELAY_PORT: "61613"
    APP_BROKER_RELAY_LOGIN: ${RABBITMQ_USER:?set RABBITMQ_USER}
    APP_BROKER_RELAY_PASSCODE: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}

services:
  backend-1:
    <<: *backend
    ports:
      - "${IP_BACKEND_WG:?set IP_BACKEND_WG}:8080:8080"
  #backend-2:
  #  <<: *backend
  #  ports:
  #    - "${IP_BACKEND_WG:?set IP_BACKEND_WG}:8082:8080"
