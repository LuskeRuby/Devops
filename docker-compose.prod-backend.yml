name: family-planner-backend

# Docker keeps every container's output in a file that grows without a limit unless it is capped. Server B's
# disk once ran full; every production service uses this cap (a CI check fails if one does not).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# x-* makes to so docker doesn't run it.
# This makes it reusable for later
x-backend: &backend
  image: ghcr.io/luskeruby/devops-backend:${TAG:?set TAG to the release version}
  restart: always
  logging: *logging
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://${IP_FRONTEND_WG:?set IP_FRONTEND_WG}:5432/familyapp
    SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER:?set PROD_DB_USER}
    SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD}
    APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET (at least 32 characters)}
    APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://${IP_FRONTEND_PUBLIC:?set IP_FRONTEND_PUBLIC}}
    # Chat messages go through RabbitMQ on Server B (STOMP relay), so every backend instance shares one
    # broker. Putting APP_BROKER_MODE=simple in this server's .env falls back to the in-memory broker,
    # which is only correct while exactly one backend runs (BACKEND_COUNT=1).
    APP_BROKER_MODE: ${APP_BROKER_MODE:-relay}
    APP_BROKER_RELAY_HOST: ${IP_FRONTEND_WG:?set IP_FRONTEND_WG}
    APP_BROKER_RELAY_PORT: "61613"
    APP_BROKER_RELAY_LOGIN: ${RABBITMQ_USER:?set RABBITMQ_USER}
    APP_BROKER_RELAY_PASSCODE: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}

services:
  backend-1:
    <<: *backend
    ports:
      - "${IP_BACKEND_WG:?set IP_BACKEND_WG}:8080:8080"
  # More instances of the same image. The release starts backend-1 .. backend-<BACKEND_COUNT> by name and
  # removes the rest; the profile only keeps a bare `docker compose up -d` from starting all of them.
  # Instance N listens on port 8079+N (8080, 8081, ...); release.yml, nginx and the PR check rely on that.
  # A fifth instance = one more block like these, MAX_BACKENDS in release.yml and a port in the PR check.
  backend-2:
    <<: *backend
    profiles: ["scale"]
    ports:
      - "${IP_BACKEND_WG:?set IP_BACKEND_WG}:8081:8080"
  backend-3:
    <<: *backend
    profiles: ["scale"]
    ports:
      - "${IP_BACKEND_WG:?set IP_BACKEND_WG}:8082:8080"
  backend-4:
    <<: *backend
    profiles: ["scale"]
    ports:
      - "${IP_BACKEND_WG:?set IP_BACKEND_WG}:8083:8080"
