# Monitoring on Server B (frontend). Used together with docker-compose.prod-frontend.yml, so it is part of
# the same compose project. Server A's Alloy pushes its logs and metrics here over WireGuard.

# Docker keeps every container's output in a file that grows without a limit unless it is capped. Server B's
# disk once ran full; every production service uses this cap (a CI check fails if one does not).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB   # whichever limit is reached first; the data is dropped, not the disk filled
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${IP_FRONTEND_WG:?set IP_FRONTEND_WG}:9090:9090"   # Server A's Alloy pushes metrics here
    restart: always
    logging: *logging

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${IP_FRONTEND_WG:?set IP_FRONTEND_WG}:3100:3100"   # Server A's Alloy pushes logs here
    restart: always
    logging: *logging

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on: [prometheus, loki]
    restart: always
    logging: *logging

  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: always
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.10.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: always
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    command: ["--nginx.scrape-uri=http://frontend:8080/stub_status"]
    depends_on: [frontend]
    restart: always
    logging: *logging

volumes:
  prometheus-data:
  loki-data:
  grafana-data: