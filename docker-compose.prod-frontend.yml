name: family-planner-infra

# Server B must never start with the dev defaults from infra/postgres, or without a broker login.
# Compose stops with an error if one of these is missing.
x-required:
  - ${POSTGRES_BIND:?set POSTGRES_BIND to Server B's WireGuard address}
  - ${PG_HBA_FILE:?set PG_HBA_FILE to pg_hba.prod.conf}
  - ${POSTGRES_USER:?set POSTGRES_USER}
  - ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  - ${RABBITMQ_BIND:?set RABBITMQ_BIND to Server B's WireGuard address}
  - ${RABBITMQ_USER:?set RABBITMQ_USER}
  - ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}

# Postgres and RabbitMQ are each defined once, in infra/. We only add prod settings on top.
include:
  - infra/postgres/docker-compose.yml
  - infra/rabbitmq/docker-compose.yml

services:
  frontend:
    image: ghcr.io/luskeruby/devops-frontend:${TAG:?set TAG to the release version}
    restart: always
    environment:
      # Used by the NGINX template
      IP_FRONTEND_PUBLIC: ${IP_FRONTEND_PUBLIC:?set IP_FRONTEND_PUBLIC}
      # One `server <address>:<port> ...;` per backend instance, built by release.yml from BACKEND_COUNT
      # (.github/scripts/backend-servers.sh).
      BACKEND_SERVERS: ${BACKEND_SERVERS:?set BACKEND_SERVERS}
      NGINX_ENVSUBST_FILTER: "^(IP_FRONTEND_PUBLIC|BACKEND_SERVERS)$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
