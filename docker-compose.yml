# Fixed project name, so container/volume names don't depend on the checkout folder (K2).
name: family-planner

# PostgreSQL is defined once, in infra/postgres, so it can later run on its own server.
include:
  - infra/postgres/docker-compose.yml

services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    depends_on:
      backend:
        condition: service_healthy
