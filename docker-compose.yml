services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: familyapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d familyapp" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    depends_on:
      - backend

volumes:
  postgres-data: