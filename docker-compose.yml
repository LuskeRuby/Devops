# Fixed project name, so container/volume names don't depend on the checkout folder (K2).
name: family-planner

# PostgreSQL is defined once, in infra/postgres, so it can later run on its own server.
include:
  - infra/postgres/docker-compose.yml

services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    depends_on:
      - backend
