<h2 mat-dialog-title>
  {{ data.eventId ? 'Rediger event' : 'Opret event' }}
</h2>

<div mat-dialog-content>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Titel</mat-label>
    <input matInput [(ngModel)]="title">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Beskrivelse</mat-label>
    <textarea matInput [(ngModel)]="description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Start</mat-label>
    <input matInput type="datetime-local" [(ngModel)]="startLocal" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Slut</mat-label>
    <input matInput type="datetime-local" [(ngModel)]="endLocal" />
  </mat-form-field>

  <div class="points-section">
    <app-points-input [(taskPoints)]="points"></app-points-input>
  </div>

  <div class="users-section">
    <mat-label>Assign family members</mat-label>

    <div class="users">
      @for (user of data.users; track user.id) {
        <label class="user-row">
          <input
            type="checkbox"
            [checked]="selectedUserIds.includes(user.id)"
            (change)="toggleUser(user.id)"
          />
          <span>{{ user.name }}</span>
        </label>
      } @empty {
        <p>Ingen familiemedlemmer tilgængelige.</p>
      }
    </div>
  </div>

</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Annuller</button>
  <button mat-raised-button color="primary"
          (click)="save()"
          [disabled]="!canSave()">
    Gem
  </button>
</div>
