<div class="dashboard-layout">
  <aside class="sidebar-pane">
    <app-sidebar></app-sidebar>
  </aside>

  <main class="content-pane">
    <section class="calendar-shell">
      <div class="calendar-header">
        <div class="calendar-controls">
          <button (click)="previous()" title="Forrige">◀</button>
          <button (click)="next()" title="Næste">▶</button>
        </div>

        <div class="calendar-title">
          @if (isDayView) {
            {{ isToday() ? 'Idag' : (viewDate | date: 'EEEE, d. MMM') }}
          }
          @if (!isDayView) {
            {{ viewDate | date: 'MMMM yyyy' }}
          }
        </div>

        @if (isParent) {
          <div class="calendar-actions">
            <button class="create-task-btn" (click)="createTask()">
              <i class="ph ph-plus-circle"></i>
              <span>Opret opgave</span>
            </button>
          </div>
        }
      </div>

      @if (isParent && familyMembers().length > 0) {
        <div class="member-filter">
          <button
            class="filter-chip"
            [class.active]="isAllSelected"
            (click)="selectAll()"
          >
            Alle
          </button>
          @for (member of familyMembers(); track member.id) {
            <button
              class="filter-chip"
              [class.active]="isUserSelected(member.id)"
              (click)="toggleUser(member.id)"
            >
              @if (getMemberImageUrl(member)) {
                <img
                  [src]="getMemberImageUrl(member)"
                  [alt]="member.name"
                  class="filter-avatar"
                />
              } @else {
                <span class="filter-initials">{{ getMemberInitials(member.name) }}</span>
              }
              <span class="filter-name">{{ member.name }}</span>
            </button>
          }
        </div>
      }

      <div [class.calendar-section]="isParent" [class.kids-wrapper-section]="!isParent">
        <app-calendar
          [viewDate]="viewDate"
          [isDayView]="isDayView"
          [filteredUserIds]="filteredUserIdsArray"
          (viewChange)="onViewChanged($event)"
        >
        </app-calendar>
      </div>
    </section>
  </main>
</div>
