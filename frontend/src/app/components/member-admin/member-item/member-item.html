<div class="member-row">
  <div class="member-info">
    <div 
      class="avatar-container" 
      [class.editable]="canEditAvatar()" 
      (click)="openAvatarSelector()"
      (keydown.enter)="openAvatarSelector()"
      tabindex="0"
      role="button"
      aria-label="Skift avatar">
      
      <img [src]="getImageUrl(member().imageId)" alt="Avatar" class="avatar-img" />
      
      @if (canEditAvatar()) {
        <div class="avatar-overlay">
          <lucide-icon [name]="PencilIcon" [size]="20"></lucide-icon>
        </div>
      }
    </div>
    <div class="text-info">
      <div class="name">{{ member().name }}</div>
      <div class="role">
        @if (member().role?.toLowerCase() === 'parent') {
          Forælder
        } @else if (member().role?.toLowerCase() === 'child') {
          Barn
        } @else {
          {{ member().role }}
        }
      </div>
    </div>
  </div>

  <div class="points-editor-wrapper">
    <app-member-point-editor [member]="member()"></app-member-point-editor>
  </div>

  @if (showActions()) {
    <div class="actions animate-fade-in">
      <button class="icon-btn" (click)="edit.emit()">
        <lucide-icon [name]="PencilIcon" [size]="22"></lucide-icon>
      </button>
      @if (isCurrentUser() === false) {
        <button class="icon-btn delete" (click)="deleteMember.emit()">
          <lucide-icon [name]="TrashIcon" [size]="22"></lucide-icon>
        </button>
      }
    </div>
  }
</div>
