<div class="list-container">
  <div class="list-header">
    <h2>Medlemmer</h2>
    @if (members().length > 0) {
      <button class="toggle-edit-btn" (click)="toggleEditMode()">
        <lucide-icon [name]="isEditMode() ? DoneIcon : EditIcon" [size]="20"></lucide-icon>
        {{ isEditMode() ? 'Færdig' : 'Rediger' }}
      </button>
    }
  </div>

  @for (member of sortedMembers(); track member.id) {
    <app-member-item
      [member]="member"
      [showActions]="isEditMode()"
      (edit)="handleEdit(member)"
      (memberUpdated)="loadMembers()"
      (deleteMember)="handleDelete(member)"
      [isCurrentUser]="member.id === currentMember?.id"
    />
  }

  @if (!isEditMode() || members().length === 0) {
    <div
      class="add-member-container"
      (click)="handleAdd()"
      (keydown.enter)="handleAdd()"
      tabindex="0"
      role="button"
    >
      <div class="plus-box">
        <lucide-icon [name]="PlusIcon" [size]="28" color="white"></lucide-icon>
      </div>
      <span class="add-text">Tilføj medlem</span>
    </div>
  }
</div>
