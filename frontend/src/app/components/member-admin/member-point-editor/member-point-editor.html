<div class="points-editor-container">
  <button class="arrow-btn down" (click)="adjustPoints(-1)">
    <lucide-icon [name]="MinusIcon" [size]="16"></lucide-icon>
  </button>
  
  <div class="points-display">
    <span class="points-value">{{ totalRewards }}</span>
    <span class="gift-icon">🎁</span>
  </div>

  <button class="arrow-btn up" (click)="adjustPoints(1)">
    <lucide-icon [name]="PlusIcon" [size]="16"></lucide-icon>
  </button>
</div>
