<div class="chat-page">

  <div class="chat-header">
    <h2>Chat</h2>

    <button (click)="connectAsUser(1)">Connect as Mark</button>
    <button (click)="connectAsUser(2)">Connect as Sarah</button>
  </div>

  <div class="chat-messages">
    <div *ngFor="let message of messages"
         class="message-wrapper"
         [ngClass]="{
           'mine': message.senderId === selectedUserId,
           'other': message.senderId !== selectedUserId
         }">

      <div class="timestamp">
        {{ message.timestamp | date:'HH:mm:ss' }}
      </div>

      <div class="bubble">
        <strong>{{ message.username }}</strong><br>
        {{ message.content }}
      </div>

    </div>
  </div>

  <div class="chat-input">
    <input
      [(ngModel)]="messageText"
      placeholder="Write message..."
      (keyup.enter)="send()"
    />

    <button (click)="send()" [disabled]="!isConnected">
      Send
    </button>
  </div>

</div>
