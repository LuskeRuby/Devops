<div class="container">
  <h1>Vælg medlem</h1>
  <div class="user-grid">
    @for (user of users(); track user.id) {
      <div class="user-card" (click)="selectUser(user)">
        <div class="avatar">
          <img [src]="user.avatarUrl || 'assets/default-avatar.png'" [alt]="user.name">
        </div>
        <span class="user-name">{{user.name}}</span>
        <div class="rewards-card">
          <div class="rewards-row">
            <span class="reward-text">Belønninger <span class="gift-icon">🎁</span></span>
            <div class="reward-box">
              <span>{{ calculateRewards(user.totalPoints || 0) }}</span>
            </div>
          </div>
        </div>
      </div>
    }
    @if (users().length === 0) {
      <div class="user-card add-member-card" (click)="addMember()">
        <div class="avatar add-avatar">
          <span class="plus-icon">+</span>
        </div>
        <span class="user-name">Add Member</span>
      </div>
    }
  </div>
</div>
