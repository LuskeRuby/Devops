<div class="container">
  <h1>Vælg medlem</h1>
  <div class="user-grid">
    @for (user of users(); track user.id) {
      <div class="user-card" (click)="selectUser(user)">
        <div class="avatar">
          <img [src]="getImageUrl(user.imageId)" [alt]="user.name">
        </div>
        <span class="user-name">{{user.name}}</span>
        <div class="rewards-card">
          <div class="rewards-row">
            <span class="reward-text">Belønninger <span class="gift-icon">🎁</span></span>
            <div class="reward-box">
              <span>{{ calculateRewards(user.totalPoints || 0) }}</span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
