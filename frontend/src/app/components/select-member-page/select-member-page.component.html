<div class="container">
  <h1>Vælg medlem</h1>
  <div class="user-grid">
    @for (user of users(); track user.id) {
      <div class="user-card" (click)="selectUser(user)">
        <div class="avatar">
          <img [src]="user.avatarUrl || 'assets/default-avatar.png'" [alt]="user.name">
        </div>
        <span class="user-name">{{user.name}}</span>
      </div>
    }
    <div class="user-card add-member-card" (click)="addMember()">
      <div class="avatar add-avatar">
        <span class="plus-icon">+</span>
      </div>
      <span class="user-name">Add Member</span>
    </div>
  </div>
</div>
