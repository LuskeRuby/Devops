<div class="dialog-container">
  <div class="dialog-header">
    <h2>Vælg et billede</h2>
    <button class="close-btn" type="button" (click)="selectImage(null)">
      <lucide-icon [name]="CloseIcon"></lucide-icon>
    </button>
  </div>

  <div class="dialog-content">
    @if (loading()) {
      <div class="loader">
        <p>Henter billeder...</p>
      </div>
    } @else {
      <div class="image-grid">
        @for (id of imageIds(); track id) {
          <button
            type="button"
            class="image-item"
            [class.selected]="id === selectedId()"
            (click)="selectImage(id)"
            aria-label="Vælg billede"
          >
            <img [src]="getImageUrl(id)" alt="Task Image" />
          </button>
        } @empty {
          <div class="loader">
            <p>Ingen billeder fundet</p>
          </div>
        }
      </div>
    }
  </div>
</div>
