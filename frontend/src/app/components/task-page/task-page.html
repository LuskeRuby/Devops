<form [formGroup]="taskForm" (ngSubmit)="createTask()">

  <div>
    <label>Navn</label>
    <input type="text" formControlName="name">
  </div>

  <div>
    <label>Beskrivelse</label>
    <input type="text" formControlName="description">
  </div>

  <div>
    <label>Point</label>
    <input type="number" formControlName="points">
  </div>

  <div>
    <label>Gentag</label>
    <select formControlName="repeatEvery">
      <option value="Daily">Dagligt</option>
      <option value="Weekly">Ugentligt</option>
      <option value="Monthly">Månedligt</option>
    </select>
  </div>

  <!-- 👇 ADD THIS BLOCK -->
  <div>
    <label>Tildel Brugere</label>

    <div *ngFor="let user of users">
      <input
        type="checkbox"
        (change)="toggleUser(user.id)">
      {{ user.name }}
    </div>
  </div>

  <button type="submit">Gem Opgave</button>

</form>
