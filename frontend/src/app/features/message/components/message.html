<h2>Chat</h2>

<button (click)="connectAsUser(1)">
  Connect as User1
</button>

<button (click)="connectAsUser(2)">
  Connect as User2
</button>

<div>
  <input [(ngModel)]="messageText" placeholder="Write message">
  <button (click)="send()" [disabled]="!isConnected">
    Send
  </button>
</div>

<ul>
  <li *ngFor="let message of messages">
    <strong>{{ message.username }}</strong>:
    {{ message.content }}
    ({{ message.timestamp | date:'HH:mm:ss' }})
  </li>
</ul>
