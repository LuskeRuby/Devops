# The single definition of the PostgreSQL service.
#
# - Root docker-compose.yml pulls this in with `include:` (dev and single-server prod).
#   Credentials are NOT set here: docker-compose.override.yml (dev) and
#   docker-compose.prod.yml (prod, from PROD_DB_* exported by the deploy) add
#   POSTGRES_USER and POSTGRES_PASSWORD.
# - On a dedicated database server (Server B) run it standalone with the credentials in the
#   environment, and pick the pg_hba profile (see README.md):
#     POSTGRES_USER=... POSTGRES_PASSWORD=... docker compose -f infra/postgres/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyapp
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
      # TLS: enable together with a pg_hba "hostssl" setup once the database leaves
      # - -c
      # - ssl=on
      # - -c
      # - ssl_cert_file=/certs/server.crt
      # - -c
      # - ssl_key_file=/certs/server.key
      # - -c
      # - ssl_min_protocol_version=TLSv1.2
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Dev rules by default; docker-compose.prod.yml mounts pg_hba.prod.conf instead.
      - ./pg_hba.dev.conf:/etc/postgresql/pg_hba.conf:ro
    shm_size: 256mb
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
