# The single definition of the PostgreSQL service.
#
# - Dev and CI: the root docker-compose.yml includes this file. docker-compose.override.yml (dev)
#   and docker-compose.ci.yml (CI) set POSTGRES_USER and POSTGRES_PASSWORD.
# - Production (Server B): docker-compose.prod-frontend.yml includes this file. What differs comes
#   from variables in Server B's .env, written by the release workflow:
#     POSTGRES_BIND                        address to publish 5432 on (Server B's WireGuard address)
#     PG_HBA_FILE                          pg_hba file in this folder (pg_hba.prod.conf)
#     POSTGRES_USER, POSTGRES_PASSWORD     database credentials
#   The defaults used below (127.0.0.1, pg_hba.dev.conf, empty credentials) are for dev only.
#   docker-compose.prod-frontend.yml refuses to start without the production values.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyapp
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
      # TLS: enable together with a pg_hba "hostssl" setup once the database leaves
      # - -c
      # - ssl=on
      # - -c
      # - ssl_cert_file=/certs/server.crt
      # - -c
      # - ssl_key_file=/certs/server.key
      # - -c
      # - ssl_min_protocol_version=TLSv1.2
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Dev rules by default; production sets PG_HBA_FILE (see the header).
      - ./${PG_HBA_FILE:-pg_hba.dev.conf}:/etc/postgresql/pg_hba.conf:ro
    shm_size: 256mb
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
