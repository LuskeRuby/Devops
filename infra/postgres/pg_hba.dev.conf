# pg_hba.conf for local development. Rules are checked top to bottom; first match wins.
# TYPE  DATABASE  USER  ADDRESS         METHOD

# Unix socket inside the container: init scripts, healthcheck, `docker compose exec psql`.
local   all       all                   trust

# Docker Desktop forwards host connections (IntelliJ, psql) and other containers over
# private ranges, so allow those with a password. Any role, including the superuser.
host    all       all   127.0.0.1/32    scram-sha-256
host    all       all   ::1/128         scram-sha-256
host    all       all   10.0.0.0/8      scram-sha-256
host    all       all   172.16.0.0/12   scram-sha-256
host    all       all   192.168.0.0/16  scram-sha-256

host    all       all   0.0.0.0/0       reject
host    all       all   ::/0            reject
