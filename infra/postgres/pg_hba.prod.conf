# pg_hba.conf for production when Postgres and the backend share a host (current setup).
# Rules are checked top to bottom; first match wins.
# TYPE  DATABASE  USER  ADDRESS         METHOD

# Unix socket inside the container: healthcheck, backups via `docker exec`.
local   all       all                   trust

# Only Docker's private networks (the backend container), always with a password.
host    all       all   172.16.0.0/12   scram-sha-256
host    all       all   192.168.0.0/16  scram-sha-256
host    all       all   10.0.0.0/8      scram-sha-256

host    all       all   0.0.0.0/0       reject
host    all       all   ::/0            reject
