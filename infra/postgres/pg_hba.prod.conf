# Server B: Postgres is reached by the backend on Server A over the WireGuard tunnel.
# TYPE  DATABASE  USER  ADDRESS        METHOD

# Unix socket inside the container: healthcheck, backups via `docker exec`.
local   all       all                  trust

# Only Server A's tunnel address, always with a password.
# This address must equal the IP_BACKEND_WG variable: this file cannot read variables, so the
# release workflow checks it before deploying.
host    all       all   10.8.0.2/32    scram-sha-256

host    all       all   0.0.0.0/0      reject
host    all       all   ::/0           reject