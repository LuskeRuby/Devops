# pg_hba.conf for production when Postgres and the backend share a host (current setup).
# Rules are checked top to bottom; first match wins.
# TYPE  DATABASE  USER                 ADDRESS         METHOD

# Unix socket inside the container: init scripts, healthcheck, backups via `docker exec`.
# The superuser can only get in this way, never over the network.
local   all       all                                  trust

# Only the two application roles, only from Docker's private networks (the backend container).
host    all       app_owner,app_rw     172.16.0.0/12   scram-sha-256
host    all       app_owner,app_rw     192.168.0.0/16  scram-sha-256
host    all       app_owner,app_rw     10.0.0.0/8      scram-sha-256

host    all       all                  0.0.0.0/0       reject
host    all       all                  ::/0            reject
