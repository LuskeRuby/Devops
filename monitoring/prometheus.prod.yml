global:
  scrape_interval: 15s

# Server A's metrics (backends and node-exporter) are not scraped from here:
# Alloy on Server A scrapes them and pushes them in with remote write.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: frontend-server
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]