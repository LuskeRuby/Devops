global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']